name: AgroChain CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/rupantorpay-payment-workflow"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Check backend JavaScript syntax
        run: |
          node --check server/index.js
          node --check server/rupantorpay.js
